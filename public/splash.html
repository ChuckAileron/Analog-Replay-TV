<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnalogReplayTV</title>
  <style>
    :root {
      --glow: #00ff66;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: var(--glow);
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 4vh, 40px);
    }

    /* Scanlines CRT */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.35) 2px,
        rgba(0, 0, 0, 0.35) 4px
      );
      pointer-events: none;
      z-index: 10;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .logo {
      font-size: clamp(28px, 6vw, 64px);
      letter-spacing: 6px;
      font-weight: bold;
      color: var(--glow);
      text-shadow:
        0 0 8px var(--glow),
        0 0 24px var(--glow),
        0 0 48px rgba(0, 255, 102, 0.6);
      animation: flicker 2.4s infinite;
      text-align: center;
      padding: 0 24px;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .spinner {
      width: clamp(20px, 3vw, 34px);
      height: clamp(20px, 3vw, 34px);
      border: 3px solid rgba(0, 255, 102, 0.25);
      border-top-color: var(--glow);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
    }
    .label {
      font-size: clamp(14px, 2.2vw, 20px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(0, 255, 102, 0.9);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .bar {
      width: min(360px, 60vw);
      height: 4px;
      background: rgba(0, 255, 102, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--glow);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--glow);
      animation: slide 1.3s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.7; }
      94% { opacity: 1; }
      97% { opacity: 0.85; }
      98% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo">AnalogReplayTV</div>
  <div class="loader">
    <div class="spinner"></div>
    <div class="label">Cargando...</div>
  </div>
  <div class="bar"><span></span></div>
</body>
</html>
